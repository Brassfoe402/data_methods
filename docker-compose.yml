services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etl_lab
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  etl_app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - .:/app
    networks:
      - etl_network

  pytest:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
    volumes:
      - .:/app
    networks:
      - etl_network
    command: pytest tests/ -v --cov=data_pipeline --cov-report=xml

volumes:
  postgres_data:

networks:
  etl_network:
