services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: etl_lab
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl_network

  etl_app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: etl_lab
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - .:/app
    networks:
      - etl_network

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: etl_lab
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - etl_network

  pytest:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: etl_lab
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    volumes:
      - .:/app
    networks:
      - etl_network
    command: pytest tests/ -v --cov=data_pipeline --cov-report=term --cov-report=xml

  dashboard:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: etl_lab
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    networks:
      - etl_network
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0

  dq_scheduler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: etl_lab
      DB_USER: postgres
      DB_PASSWORD: postgres
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB: etl_lab
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@etl-lab.local}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - .:/app
    networks:
      - etl_network
    command: python scheduler/dq_scheduler.py
    restart: unless-stopped


volumes:
  postgres_data:
  mysql_data:

networks:
  etl_network:
