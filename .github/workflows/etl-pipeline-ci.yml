name: CI Pipeline

on: [push, pull_request]

jobs:
  compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose build

      - name: Start databases (postgres + mysql)
        run: |
          docker compose up -d postgres mysql
          docker compose ps

      - name: Wait for DB healthchecks
        run: |
          set -e

          PG_ID=$(docker compose ps -q postgres)
          MY_ID=$(docker compose ps -q mysql)

          echo "postgres container: $PG_ID"
          echo "mysql container:     $MY_ID"

          for i in {1..90}; do
            PG=$(docker inspect --format='{{.State.Health.Status}}' "$PG_ID" 2>/dev/null || echo "starting")
            MY=$(docker inspect --format='{{.State.Health.Status}}' "$MY_ID" 2>/dev/null || echo "starting")

            echo "[$i] postgres=$PG mysql=$MY"

            if [ "$PG" = "healthy" ] && [ "$MY" = "healthy" ]; then
              echo "Both DBs are healthy"
              break
            fi

            sleep 2
          done

          PG=$(docker inspect --format='{{.State.Health.Status}}' "$PG_ID")
          MY=$(docker inspect --format='{{.State.Health.Status}}' "$MY_ID")

          if [ "$PG" != "healthy" ] || [ "$MY" != "healthy" ]; then
            echo "DBs did not become healthy"
            docker compose logs postgres || true
            docker compose logs mysql || true
            exit 1
          fi

      - name: Run tests (pytest container) + coverage.xml
        run: |
          docker compose run --rm pytest

      - name: Run full pipeline (etl_app)
        run: |
          docker compose run --rm etl_app python main.py

      - name: Acceptance checks (Postgres + MySQL)
        run: |
          set -e

          PG_ID=$(docker compose ps -q postgres)
          MY_ID=$(docker compose ps -q mysql)

          echo "=== POSTGRES CHECKS (objects + counts + view definition) ==="
          docker exec -i "$PG_ID" psql -U postgres -d etl_lab -v ON_ERROR_STOP=1 <<'SQL'
          \pset pager off
          \echo '--- objects ---'
          \dt s_psql_dds.*
          \dv s_psql_dds.*

          \echo '--- function exists ---'
          \df s_psql_dds.fn_dm_data_load

          \echo '--- counts (must be > 0 and view_cnt == dm_pg == structured) ---'
          SELECT
            (SELECT count(*) FROM s_psql_dds.t_sql_source_unstructured) AS unstructured,
            (SELECT count(*) FROM s_psql_dds.t_sql_source_structured)   AS structured,
            (SELECT count(*) FROM s_psql_dds.t_dm_task)                 AS dm_pg,
            (SELECT count(*) FROM s_psql_dds.v_dm_task)                 AS view_cnt;

          \echo '--- view definition (must list fields, not select *) ---'
          \d+ s_psql_dds.v_dm_task

          \echo '--- sample from view ---'
          SELECT id,id_source,source_id,category_id,status_id,region_id,amount,duration,count,created_at,updated_at,load_dttm
          FROM s_psql_dds.v_dm_task
          ORDER BY id DESC
          LIMIT 5;
SQL

          echo "=== MYSQL CHECKS (tables + procedure + counts) ==="
          docker exec -i "$MY_ID" mysql -uroot -proot -e "
            USE etl_lab;

            SELECT 'tables' AS section;
            SHOW TABLES;

            SELECT 'procedure' AS section;
            SHOW PROCEDURE STATUS WHERE Db='etl_lab' AND Name='fn_dm_data_stg_to_dm_load';

            SELECT 'counts (must be > 0 and dm_cnt == stg_cnt)' AS section;
            SELECT COUNT(*) AS stg_cnt FROM t_dm_stg_task;
            SELECT COUNT(*) AS dm_cnt  FROM t_dm_task;

            SELECT 'sample' AS section;
            SELECT id,id_source,source_id,category_id,status_id,region_id,amount,duration,count,created_at,updated_at,load_dttm
            FROM t_dm_task
            ORDER BY id DESC
            LIMIT 5;
          "

          echo "=== HARD ASSERTS (fail CI if broken) ==="
          # 1) Postgres: structured == dm_pg == view_cnt and > 0
          PG_COUNTS=$(docker exec -i "$PG_ID" psql -U postgres -d etl_lab -At <<'SQL'
          SELECT
            (SELECT count(*) FROM s_psql_dds.t_sql_source_structured)::text || ',' ||
            (SELECT count(*) FROM s_psql_dds.t_dm_task)::text || ',' ||
            (SELECT count(*) FROM s_psql_dds.v_dm_task)::text;
SQL
          )
          echo "PG structured,dm_pg,view_cnt = $PG_COUNTS"
          PG_STRUCT=$(echo "$PG_COUNTS" | cut -d',' -f1)
          PG_DM=$(echo "$PG_COUNTS" | cut -d',' -f2)
          PG_VIEW=$(echo "$PG_COUNTS" | cut -d',' -f3)

          if [ "$PG_STRUCT" -eq 0 ] || [ "$PG_DM" -eq 0 ] || [ "$PG_VIEW" -eq 0 ]; then
            echo "FAIL: Postgres counts are zero"
            exit 1
          fi
          if [ "$PG_STRUCT" -ne "$PG_DM" ] || [ "$PG_DM" -ne "$PG_VIEW" ]; then
            echo "FAIL: Postgres counts mismatch (structured != dm_pg != view_cnt)"
            exit 1
          fi

          # 2) MySQL: stg_cnt == dm_cnt and > 0
          MY_COUNTS=$(docker exec -i "$MY_ID" mysql -uroot -proot -N -e "
            USE etl_lab;
            SELECT CONCAT(
              (SELECT COUNT(*) FROM t_dm_stg_task), ',', (SELECT COUNT(*) FROM t_dm_task)
            );
          ")
          echo "MY stg_cnt,dm_cnt = $MY_COUNTS"
          MY_STG=$(echo "$MY_COUNTS" | cut -d',' -f1)
          MY_DM=$(echo "$MY_COUNTS" | cut -d',' -f2)

          if [ "$MY_STG" -eq 0 ] || [ "$MY_DM" -eq 0 ]; then
            echo "FAIL: MySQL counts are zero"
            exit 1
          fi
          if [ "$MY_STG" -ne "$MY_DM" ]; then
            echo "FAIL: MySQL counts mismatch (stg_cnt != dm_cnt)"
            exit 1
          fi

      - name: Extract coverage.xml from a created pytest container
        run: |
          set -e
          CID=$(docker compose create pytest)
          docker cp "$CID":/app/coverage.xml ./coverage.xml
          docker rm -v "$CID"
          ls -la coverage.xml

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
