name: CI Pipeline

on: [push, pull_request]

jobs:
  compose-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose build

      - name: Start databases (postgres + mysql)
        run: |
          docker compose up -d postgres mysql
          docker compose ps

      - name: Wait for DB healthchecks
        run: |
          set -e

          PG_ID=$(docker compose ps -q postgres)
          MY_ID=$(docker compose ps -q mysql)

          echo "postgres container: $PG_ID"
          echo "mysql container:     $MY_ID"

          for i in {1..90}; do
            PG=$(docker inspect --format='{{.State.Health.Status}}' "$PG_ID" 2>/dev/null || echo "starting")
            MY=$(docker inspect --format='{{.State.Health.Status}}' "$MY_ID" 2>/dev/null || echo "starting")

            echo "[$i] postgres=$PG mysql=$MY"

            if [ "$PG" = "healthy" ] && [ "$MY" = "healthy" ]; then
              echo "Both DBs are healthy"
              break
            fi

            sleep 2
          done

          PG=$(docker inspect --format='{{.State.Health.Status}}' "$PG_ID")
          MY=$(docker inspect --format='{{.State.Health.Status}}' "$MY_ID")

          if [ "$PG" != "healthy" ] || [ "$MY" != "healthy" ]; then
            echo "DBs did not become healthy"
            docker compose logs postgres || true
            docker compose logs mysql || true
            exit 1
          fi

      - name: Run tests (pytest container) + coverage.xml
        run: |
          docker compose run --rm pytest

      - name: Run full pipeline (etl_app)
        run: |
          docker compose run --rm etl_app python main.py

      - name: Acceptance checks (Postgres + MySQL + DQ)
        run: |
          set -e
          PG_ID=$(docker compose ps -q postgres)
          MY_ID=$(docker compose ps -q mysql)

          echo "=== Postgres checks ==="
          docker exec -i "$PG_ID" psql -U postgres -d etl_lab -v ON_ERROR_STOP=1 -c "
            SELECT
              (SELECT count(*) FROM s_psql_dds.t_sql_source_unstructured) AS unstructured,
              (SELECT count(*) FROM s_psql_dds.t_sql_source_structured)   AS structured,
              (SELECT count(*) FROM s_psql_dds.t_dm_task)                 AS dm_pg,
              (SELECT count(*) FROM s_psql_dds.v_dm_task)                 AS view_cnt;
          "

          echo "=== MySQL checks ==="
          docker exec -i "$MY_ID" mysql -uroot -proot -e "
            USE etl_lab;
            SELECT COUNT(*) AS stg_cnt FROM t_dm_stg_task;
            SELECT COUNT(*) AS dm_cnt  FROM t_dm_task;
          "

          echo "=== Data Quality Checks Results (last 10) ==="
          docker exec -i "$PG_ID" psql -U postgres -d etl_lab -v ON_ERROR_STOP=1 -c "
            SELECT
              check_type,
              status,
              execution_date,
              LEFT(error_message, 100) AS message_preview
            FROM s_psql_dds.t_dq_check_results
            ORDER BY execution_date DESC, check_type
            LIMIT 10;
          "

          echo "=== Data Quality Summary (last 1 hour) ==="
          docker exec -i "$PG_ID" psql -U postgres -d etl_lab -v ON_ERROR_STOP=1 -c "
            SELECT
              status,
              COUNT(*) AS count
            FROM s_psql_dds.t_dq_check_results
            WHERE execution_date >= NOW() - INTERVAL '1 hour'
            GROUP BY status
            ORDER BY status;
          "

      - name: Extract coverage.xml from a created pytest container
        run: |
          set -e
          CID=$(docker compose create pytest)
          docker cp "$CID":/app/coverage.xml ./coverage.xml || true
          docker rm -v "$CID" || true
          ls -la coverage.xml || true

      - name: Upload coverage.xml artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Shutdown
        if: always()
        run: |
          docker compose down -v
